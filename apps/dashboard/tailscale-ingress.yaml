apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: dashboard
      port:
        number: 80
  tls:
    - hosts:
        - dashboard
