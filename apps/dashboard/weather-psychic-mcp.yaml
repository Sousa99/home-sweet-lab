apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-psychic-mcp
  namespace: dashboard
  labels:
    app.kubernetes.io/name: weather-psychic
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-psychic
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-psychic
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: home-sweet-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: dietpi
        kubernetes.io/arch: amd64
      containers:
        - name: mcp
          image: ghcr.io/sousa99/weather-psychic-backend:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/index.js
            - --mcp
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: MCP_PORT
              value: "3001"
          ports:
            - name: mcp
              containerPort: 3001
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weather-psychic-mcp
  namespace: dashboard
  labels:
    app.kubernetes.io/name: weather-psychic
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: weather-psychic
    app.kubernetes.io/component: mcp
  ports:
    - name: mcp
      port: 3001
      targetPort: mcp
      protocol: TCP
