apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-psychic-mcp
  namespace: dashboard
  labels:
    app.kubernetes.io/name: weather-psychic
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-psychic
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-psychic
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: home-sweet-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: dietpi
        kubernetes.io/arch: amd64
      containers:
        - name: mcp
          image: ghcr.io/sousa99/weather-psychic-backend:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/index.js
            - --mcp
          env:
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "3000"
            - name: MCP_PORT
              value: "3002"
          ports:
            - name: mcp-internal
              containerPort: 3002
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: mcp-internal
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mcp-internal
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mcp-internal
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: host-rewrite
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp-proxy
              containerPort: 3001
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          startupProbe:
            tcpSocket:
              port: mcp-proxy
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mcp-proxy
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mcp-proxy
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: host-rewrite-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: mcp-host-rewrite.conf
              readOnly: true
      volumes:
        - name: host-rewrite-config
          configMap:
            name: dashboard-mcp-host-rewrite
            items:
              - key: mcp-host-rewrite.conf
                path: mcp-host-rewrite.conf
---
apiVersion: v1
kind: Service
metadata:
  name: weather-psychic-mcp
  namespace: dashboard
  labels:
    app.kubernetes.io/name: weather-psychic
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: weather-psychic
    app.kubernetes.io/component: mcp
  ports:
    - name: mcp
      port: 3001
      targetPort: mcp-proxy
      protocol: TCP
