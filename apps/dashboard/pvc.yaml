apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bus-catcher-data
  namespace: dashboard
  labels:
    app.kubernetes.io/name: bus-catcher
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: procrastinator-data
  namespace: dashboard
  labels:
    app.kubernetes.io/name: procrastinator-tracker
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
