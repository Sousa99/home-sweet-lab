apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dashboard
resources:
  - namespace.yaml
  - pvc.yaml
  - bus-catcher-rest.yaml
  - bus-catcher-mcp.yaml
  - fly-over-tracker-rest.yaml
  - fly-over-tracker-mcp.yaml
  - procrastinator-tracker-rest.yaml
  - procrastinator-tracker-mcp.yaml
  - weather-psychic-rest.yaml
  - weather-psychic-mcp.yaml
  - frontend.yaml
  - tailscale-ingress.yaml
configMapGenerator:
  - name: dashboard-nginx
    files:
      - nginx.conf
  - name: dashboard-config-check
    files:
      - validate-config.py
  - name: dashboard-mcp-host-rewrite
    files:
      - mcp-host-rewrite.conf
