apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: host-metrics
  namespace: flux-system
spec:
  image: ghcr.io/sousa99/home-sweet-lab-host-metrics
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: host-metrics
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: host-metrics
  filterTags:
    pattern: '^main-[0-9]{14}-[0-9a-f]{7}$'
  policy:
    alphabetical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: host-metrics
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: 'chore: update host-metrics image'
    push:
      branch: main
  update:
    strategy: Setters
    path: ./apps/host-metrics
