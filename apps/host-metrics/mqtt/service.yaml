apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: home-sweet-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
